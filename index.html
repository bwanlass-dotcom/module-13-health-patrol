const KEY='ranch_manager_rounds_v1';
const stops=[
{id:'cattle',name:'Cattle pasture',icon:'🐄',species:'cattle',img:'cattle',required:true,intro:'A group of cattle is grazing. One calf is standing apart and appears quieter than the rest.',target:'The quiet calf',clues:[['Herd behavior','Most cattle are eating. The calf is standing alone and has not joined the group at the feed area.'],['Breathing and appetite','The calf is breathing faster than nearby cattle and has eaten very little this morning.'],['Body condition','No obvious open wound is visible. The combination of behavior, appetite, and breathing changes needs prompt attention.']],q:'Which observation best supports a health concern?',answers:['The calf is standing near a fence.','The calf is isolated, eating less, and breathing faster than the herd.','The calf has a normal hair coat.'],correct:1,decisions:['Ignore it until the next scheduled roundup.','Record the signs, minimize stress, separate as appropriate, and contact the veterinarian promptly.','Give leftover antibiotics without veterinary direction.'],best:1,why:'Behavior changes plus reduced appetite and increased breathing effort warrant prompt evaluation; avoid diagnosing or medicating independently.'},
{id:'horse',name:'Horse paddock',icon:'🐎',species:'horse',img:'horse',required:true,intro:'The horses are moving around their paddock. One horse takes shorter steps on its front left leg.',target:'The horse with the shortened stride',clues:[['Movement','The horse shortens its stride on the left forelimb and shifts weight when standing.'],['Leg and hoof','There is mild warmth around the lower leg; no major external wound is obvious.'],['Behavior','The horse remains alert but is reluctant to trot.']],q:'Which body system is most directly involved in the abnormal gait?',answers:['Musculoskeletal system','Digestive system','Reproductive system'],correct:0,decisions:['Work the horse harder to loosen it up.','Limit movement, document the signs, and arrange appropriate veterinary or farrier assessment.','Assume the horse is fine because it is alert.'],best:1,why:'A changed gait is a potential lameness sign. Avoid forced exercise and arrange appropriate assessment.'},
{id:'goat',name:'Goat pens',icon:'🐐',species:'goat',img:'goat',required:true,intro:'Several goats are browsing. One goat looks less active and has loose manure.',target:'The quieter goat',clues:[['Appetite','The goat approaches feed but eats less than penmates.'],['Manure','Loose manure is visible beneath the goat.'],['General appearance','The goat is subdued. Check hydration and report concerns; a visual inspection alone cannot identify the cause.']],q:'Which combination is most important to record?',answers:['Coat color and horn shape only','Feed brand only','Appetite, manure consistency, behavior, and hydration-related observations'],correct:2,decisions:['Ignore the loose manure because goats have variable diets.','Record signs, check water and feed, use biosecurity precautions, and consult the veterinarian if signs persist or worsen.','Immediately administer an unprescribed dewormer.'],best:1,why:'Changes in appetite, manure, and behavior should be documented; causes cannot be confirmed from appearance alone.'},
{id:'poultry',name:'Poultry run',icon:'🐔',species:'poultry',img:'poultry',required:true,intro:'Most hens are active. One hen is fluffed up, quieter than usual, and has discharge near the nostrils.',target:'The quiet hen',clues:[['Activity','One bird remains apart from the flock with feathers fluffed.'],['Eyes and nares','Moist discharge is visible around the nostrils.'],['Environment','Shared waterers and equipment can spread infectious material if not cleaned and managed correctly.']],q:'What is the strongest reason to act promptly?',answers:['The bird has brown feathers.','The bird is quieter than normal and has nasal discharge.','The bird is standing in shade.'],correct:1,decisions:['Move freely between poultry and other animals without cleaning boots.','Document signs, separate the bird as appropriate, restrict shared equipment, and seek veterinary guidance.','Give medication intended for cattle.'],best:1,why:'Behavior and respiratory changes require attention; biosecurity protects the rest of the flock.'},
{id:'quarantine',name:'Arrival & biosecurity gate',icon:'🧼',species:'biosecurity',img:'quarantine',required:true,intro:'A newly purchased animal is due to arrive, and the same boots and tools have been used in multiple pens.',target:'The arrival area',clues:[['New arrival','The new animal has not yet been observed through an appropriate isolation period.'],['Shared tools','A bucket and boots were moved between pens without cleaning.'],['Traffic flow','Visitors and equipment can carry pathogens between animal groups.']],q:'Which route could transmit disease even without animal-to-animal contact?',answers:['Contaminated boots, buckets, or tools (fomites)','Only direct contact between two animals','Sunlight on an empty fence'],correct:0,decisions:['Immediately introduce the new animal to the herd.','Use an appropriate quarantine protocol, clean then disinfect equipment, and manage animal and visitor movement.','Disinfect visible dirt without cleaning it first.'],best:1,why:'Quarantine and cleaning followed by disinfection reduce disease transmission risk.'},
{id:'calf',name:'Calving barn · bonus',icon:'🐮',species:'cattle',img:'calf',required:false,intro:'A young calf is resting in a clean pen. Review the environment and basic health indicators.',target:'The young calf',clues:[['Behavior','The calf responds to nearby movement and rises with encouragement.'],['Feeding','The calf has recently nursed according to the ranch record.'],['Housing','Bedding is dry and water and feed management records are available.']],q:'What is the best baseline practice?',answers:['Record normal behavior, feeding, and housing conditions for future comparison.','Only check calves when they collapse.','Assume every calf has the same normal pattern.'],correct:0,decisions:['Keep a baseline record and continue routine monitoring.','Give antibiotics as a preventive measure without a veterinary plan.','Remove water from the pen.'],best:0,why:'Knowing normal behavior and keeping records makes changes easier to detect.'}
];
const anatomy={cattle:{skeleton:['cattle_skeleton','Bovine skeleton','The skull, spine, ribs, and limb bones support and protect the animal. Watch for joint swelling and altered gait.'],muscles:['cattle_muscles','Bovine muscles','Muscles move the skeleton. Observe strength, posture, and reluctance to rise or walk.'],oxygen:['cattle_oxygen','Bovine respiratory & circulatory systems','The lungs exchange gases; the heart circulates oxygenated blood. Watch breathing effort, coughing, and weakness.'],digest:['cattle_digest','Ruminant digestion','Cattle have a four-compartment stomach: rumen, reticulum, omasum, and abomasum. Monitor appetite, cud chewing, and manure.']},horse:{skeleton:['horse_skeleton','Equine skeletal system','The horse’s limbs, joints, spine, and hooves work together in locomotion. Watch for asymmetry and lameness.'],muscles:[null,'Equine muscular system','Muscles and tendons produce movement; compare stride, posture, and willingness to move.'],oxygen:[null,'Equine respiratory & circulatory systems','Observe breathing at rest, nasal discharge, coughing, and exercise tolerance.'],digest:[null,'Equine digestive system','Horses are hindgut fermenters, not ruminants. Watch appetite, manure, and signs of abdominal discomfort.']},goat:{skeleton:[null,'Caprine skeletal system','Observe gait, posture, joints, and weight-bearing.'],muscles:[null,'Caprine muscular system','Watch for weakness, reluctance to move, and abnormal posture.'],oxygen:[null,'Caprine respiratory & circulatory systems','Monitor breathing effort, nasal discharge, and overall alertness.'],digest:[null,'Goat digestive system','Goats are ruminants. Monitor cud chewing, appetite, rumen activity, and manure.']},poultry:{skeleton:[null,'Avian skeletal system','Birds have lightweight skeletal adaptations and a keel bone for flight muscles.'],muscles:[null,'Avian muscular system','Breast and leg muscles support movement; observe stance and activity.'],oxygen:[null,'Avian respiratory system','Birds have lungs and air sacs. Observe open-mouth breathing, tail bobbing, and discharge.'],digest:[null,'Avian digestive system','Birds have a crop, proventriculus, and gizzard; monitor eating, droppings, and crop-related concerns.']}};
const blank=()=>({page:'map',clues:{},answers:{},decisions:{},notes:{},completed:{},ref:'skeleton'});let state;try{state={...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state=blank()}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);const total=stops.filter(x=>x.required).length;const complete=()=>stops.filter(x=>x.required&&state.completed[x.id]).length;const score=()=>stops.reduce((a,s)=>a+(state.completed[s.id]?((state.answers[s.id]===s.correct?10:0)+(state.decisions[s.id]===s.best?10:0)):0),0);const max=stops.length*20;
function nav(){let list=`<button class="navbtn ${state.page==='map'?'active':''}" data-go="map">🗺️ Ranch map / truck</button>`;for(const s of stops)list+=`<button class="navbtn ${state.page===s.id?'active':''} ${state.completed[s.id]?'done':''}" data-go="${s.id}">${s.icon} ${esc(s.name)}</button>`;list+=`<button class="navbtn ${state.page==='report'?'active':''}" data-go="report">📋 Final herd report</button>`;$('nav').innerHTML=list;$('progressText').textContent=`${complete()} of ${total} required inspections complete`;$('bar').style.width=`${100*complete()/total}%`;$('score').textContent=`${score()} / ${max}`;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.page=b.dataset.go;save();render()})}
function map(){return `<section class="panel"><span class="tag">YOUR MORNING SHIFT</span><h2 class="sectiontitle">Climb into the ranch truck</h2><p>You're the ranch manager. Drive to any location, study the livestock photographs, collect all three observations, and decide what to do. You can travel in any order, but all <b>${total} required stops</b> must be completed before submitting your report.</p><div class="hero"><img src="${imageURL("ranch")}" alt="Photographic ranch overview"><div class="herolabel">🚙 Choose your next stop below</div></div></section><section class="panel"><h2 class="sectiontitle">Choose a ranch destination</h2><div class="map">${stops.map(s=>`<button class="place" data-go="${s.id}"><img src="${imageURL(s.img)}" alt="${esc(s.name)}"><div><strong>${s.icon} ${esc(s.name)}</strong><span>${s.required?'REQUIRED':'OPTIONAL'} · ${state.completed[s.id]?'✓ INSPECTED':'NOT YET INSPECTED'}</span></div></button>`).join('')}</div></section>`}
function inspection(s){const seen=state.clues[s.id]||[];const finished=!!state.completed[s.id];return `<section class="panel"><div class="row" style="justify-content:space-between"><span class="tag">${s.required?'REQUIRED INSPECTION':'OPTIONAL INSPECTION'}</span><button class="btn light" data-go="map">← Drive to ranch map</button></div><h2 class="sectiontitle">${s.icon} ${esc(s.name)}</h2><p>${esc(s.intro)}</p><div class="hero"><img src="${imageURL(s.img)}" alt="Photographic view of ${esc(s.name)}"><div class="herolabel">🔎 Focus: ${esc(s.target)}</div></div><div class="tools"><button class="tool" id="showRef">🩺 Open ${s.species==='biosecurity'?'biosecurity guide':s.species+' anatomy guide'}</button></div><p class="muted small">Images are illustrative photographs. The scenario observations below provide the evidence for your decisions; a photo alone cannot establish a diagnosis.</p></section><section class="panel"><h2 class="sectiontitle">1 · Collect field observations <span class="muted small">(${seen.length}/3)</span></h2><p>Choose each inspection focus to reveal what your ranch manager observes up close.</p><div class="tools">${s.clues.map((c,i)=>`<button class="tool ${seen.includes(i)?'active':''}" data-clue="${i}">${seen.includes(i)?'✓ ': '＋ '}${esc(c[0])}</button>`).join('')}</div>${seen.map(i=>`<div class="clue"><b>${esc(s.clues[i][0])}:</b> ${esc(s.clues[i][1])}</div>`).join('')}<label for="note"><b>Your field notes</b> (optional)</label><textarea class="field" id="note" placeholder="Record what you notice…">${esc(state.notes[s.id]||'')}</textarea></section><section class="panel"><h2 class="sectiontitle">2 · Interpret the evidence</h2>${seen.length<3?'<div class="warning">Inspect all three observation areas before submitting a decision.</div>':''}<p><b>${esc(s.q)}</b></p>${s.answers.map((a,i)=>`<label class="choice"><input type="radio" name="answer" value="${i}" ${state.answers[s.id]===i?'checked':''} ${finished?'disabled':''}>${esc(a)}</label>`).join('')}<h2 class="sectiontitle">3 · Make a management decision</h2><p>What should you do next?</p>${s.decisions.map((a,i)=>`<label class="choice"><input type="radio" name="decision" value="${i}" ${state.decisions[s.id]===i?'checked':''} ${finished?'disabled':''}>${esc(a)}</label>`).join('')}<button class="btn" id="submit" ${finished?'disabled':''}>${finished?'Inspection recorded':'Record inspection decision'}</button><p id="validation" class="muted small"></p>${finished?`<div class="feedback"><b>Inspection complete.</b> ${esc(s.why)}<p><b>Evidence:</b> ${state.answers[s.id]===s.correct?'Correct interpretation.':'Review the observations and compare them to the best interpretation.'} <b>Action:</b> ${state.decisions[s.id]===s.best?'Appropriate management response.':'Consider the safest action and when to involve a veterinarian.'}</p></div>`:''}</section><section class="panel" id="reference" hidden></section>`}
function reference(s){if(s.species==='biosecurity')return `<h2 class="sectiontitle">Biosecurity field reference</h2><p><b>Transmission:</b> pathogens may spread through direct contact, droplets, contaminated tools or boots (fomites), and animal movement.</p><p><b>Prevention:</b> plan animal arrivals, isolate as appropriate, restrict traffic, clean organic matter before applying a suitable disinfectant, and follow veterinary and label guidance.</p>`;let a=anatomy[s.species]||anatomy.cattle;let v=a[state.ref]||a.skeleton;return `<h2 class="sectiontitle">${s.icon} ${esc(s.species)} · Anatomy field library</h2><div class="tools">${Object.keys(a).map(k=>`<button class="tool ${state.ref===k?'active':''}" data-ref="${k}">${({skeleton:'🦴 Skeleton',muscles:'💪 Muscles',oxygen:'🫁 Oxygen systems',digest:'🌿 Digestion'})[k]}</button>`).join('')}</div><div class="ref">${v[0]?`<img src="${imageURL(v[0])}" alt="${esc(v[1])} photographic reference">`:`<div class="notice"><b>Species-specific reference</b><p class="small">No verified anatomy photograph is included for this view. We do not substitute a cow image for another species.</p></div>`}<div><h3>${esc(v[1])}</h3><p>${esc(v[2])}</p><p class="small muted">Anatomy thumbnails are illustrative visual references, not validated anatomical plates or diagnostic images.</p></div></div>`}
function report(){let ready=complete()===total;return `<section class="panel"><span class="tag">END OF SHIFT</span><h2 class="sectiontitle">Final herd health report</h2><div class="summary"><div class="stat"><strong>${complete()}/${total}</strong>Required stops</div><div class="stat"><strong>${score()}</strong>Points earned</div><div class="stat"><strong>${stops.filter(s=>state.completed[s.id]).length}</strong>Total inspections</div></div><p>${ready?'All required inspections are complete. Review your management decisions below.':'Complete the remaining required inspections to unlock your verification word.'}</p>${stops.filter(s=>state.completed[s.id]).map(s=>`<div class="clue"><b>${esc(s.name)}</b> · ${esc(s.target)}<br><span class="small">Management response: ${esc(s.decisions[state.decisions[s.id]])}</span><br><span class="small">Field notes: ${esc(state.notes[s.id]||'No additional notes recorded.')}</span></div>`).join('')}${ready?`<div class="feedback"><h3>Shift complete ✓</h3><p>Your Canvas verification word is:</p><h2 style="font-size:32px;letter-spacing:3px;color:#872c21">HERDSMART</h2><p>Submit <b>HERDSMART</b> and your score in the separate Canvas assignment.</p><button class="btn alt" id="copy">Copy completion summary</button></div>`:`<button class="btn" data-go="map">Return to ranch map</button>`}</section>`}
function render(){nav();$('app').innerHTML=state.page==='map'?map():state.page==='report'?report():inspection(stops.find(s=>s.id===state.page)||stops[0]);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.page=b.dataset.go;save();render()});document.querySelectorAll('[data-clue]').forEach(b=>b.onclick=()=>{let id=state.page;let a=state.clues[id]||[];let i=Number(b.dataset.clue);if(!a.includes(i))a.push(i);state.clues[id]=a;save();render()});let n=$('note');if(n)n.oninput=()=>{state.notes[state.page]=n.value;save()};document.querySelectorAll('input[name="answer"]').forEach(b=>b.onchange=()=>{state.answers[state.page]=Number(b.value);save()});document.querySelectorAll('input[name="decision"]').forEach(b=>b.onchange=()=>{state.decisions[state.page]=Number(b.value);save()});let submit=$('submit');if(submit)submit.onclick=()=>{let s=stops.find(x=>x.id===state.page);if((state.clues[s.id]||[]).length<3||state.answers[s.id]===undefined||state.decisions[s.id]===undefined){$('validation').textContent='Collect all three observations and select both answers before recording your decision.';return}state.completed[s.id]=true;save();render()};let show=$('showRef');if(show)show.onclick=()=>{let s=stops.find(x=>x.id===state.page),r=$('reference');r.hidden=!r.hidden;if(!r.hidden){r.innerHTML=reference(s);r.scrollIntoView({behavior:'smooth',block:'nearest'});r.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>{state.ref=b.dataset.ref;save();r.innerHTML=reference(s);r.querySelectorAll('[data-ref]').forEach(b2=>b2.onclick=()=>{state.ref=b2.dataset.ref;save();render();$('showRef').click()})})}};let copy=$('copy');if(copy)copy.onclick=()=>{let msg=`Ranch Manager: Herd Health Rounds\nRequired inspections: ${complete()}/${total}\nScore: ${score()}/${max}\nVerification: HERDSMART`;navigator.clipboard?.writeText(msg).then(()=>copy.textContent='Copied!').catch(()=>prompt('Copy your report:',msg))}}
$('reset').onclick=()=>{if(confirm('Start a new shift? This clears your saved observations and score.')){state=blank();save();render()}};render();
</script></body></html>
